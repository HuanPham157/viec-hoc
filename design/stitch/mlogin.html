<!DOCTYPE html>

<html class="h-full" lang="vi"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/><meta content="mobile_blank" name="shell-type"/><link href="https://fonts.googleapis.com" rel="preconnect"/><link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/><link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,700;1,400&amp;display=swap" rel="stylesheet"/><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/><style>@layer base{html,body{width:100%;margin:0;padding:0;min-height:100%;}body{overscroll-behavior-y:none;-webkit-tap-highlight-color:transparent;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { "colors": { "on-primary": "#ffffff", "surface-container-lowest": "#ffffff", "secondary-fixed-dim": "#4edea3", "surface-container-highest": "#d3e4fe", "surface": "#f8f9ff", "on-tertiary-fixed-variant": "#653e00", "on-secondary-container": "#00714d", "inverse-primary": "#b4c5ff", "outline-variant": "#c3c6d7", "on-background": "#0b1c30", "on-secondary-fixed-variant": "#005236", "on-primary-container": "#eeefff", "on-tertiary": "#ffffff", "on-secondary": "#ffffff", "surface-bright": "#f8f9ff", "on-error": "#ffffff", "on-surface-variant": "#434655", "surface-container-high": "#dce9ff", "surface-variant": "#d3e4fe", "primary": "#004ac6", "secondary-fixed": "#6ffbbe", "inverse-surface": "#213145", "background": "#f8f9ff", "on-primary-fixed": "#00174b", "on-primary-fixed-variant": "#003ea8", "outline": "#737686", "error": "#ba1a1a", "primary-container": "#2563eb", "error-container": "#ffdad6", "secondary": "#006c49", "on-secondary-fixed": "#002113", "tertiary-fixed": "#ffddb8", "secondary-container": "#6cf8bb", "primary-fixed": "#dbe1ff", "inverse-on-surface": "#eaf1ff", "surface-container-low": "#eff4ff", "surface-container": "#e5eeff", "primary-fixed-dim": "#b4c5ff", "surface-tint": "#0053db", "tertiary-fixed-dim": "#ffb95f", "on-error-container": "#93000a", "tertiary": "#784b00", "tertiary-container": "#996100", "on-surface": "#0b1c30", "on-tertiary-fixed": "#2a1700", "surface-dim": "#cbdbf5", "on-tertiary-container": "#ffeedd" }, "borderRadius": { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" }, "spacing": { "gutter": "1rem", "space-lg": "1.5rem", "space-md": "1rem", "gutter-desktop": "1.5rem", "space-xl": "2rem", "space-xs": "0.25rem", "space-sm": "0.5rem", "margin-desktop": "2rem", "margin": "1rem", "margin-tablet": "1.5rem" }, "fontFamily": { "body-sm": ["Be Vietnam Pro"], "body-md": ["Be Vietnam Pro"], "headline-md": ["Be Vietnam Pro"], "headline-lg": ["Be Vietnam Pro"], "body-lg": ["Be Vietnam Pro"], "label-sm": ["Be Vietnam Pro"], "label-md": ["Be Vietnam Pro"], "label-lg": ["Be Vietnam Pro"], "display": ["Be Vietnam Pro"], "display-mobile": ["Be Vietnam Pro"], "headline-lg-mobile": ["Be Vietnam Pro"] }, "fontSize": { "body-sm": ["12px", { "lineHeight": "16px", "fontWeight": "400" }], "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }], "headline-md": ["18px", { "lineHeight": "26px", "letterSpacing": "-0.01em", "fontWeight": "600" }], "headline-lg": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.015em", "fontWeight": "600" }], "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }], "label-sm": ["11px", { "lineHeight": "14px", "letterSpacing": "0.02em", "fontWeight": "600" }], "label-md": ["12px", { "lineHeight": "16px", "letterSpacing": "0.01em", "fontWeight": "500" }], "label-lg": ["14px", { "lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "600" }], "display": ["36px", { "lineHeight": "44px", "letterSpacing": "-0.02em", "fontWeight": "700" }], "display-mobile": ["28px", { "lineHeight": "36px", "letterSpacing": "-0.01em", "fontWeight": "700" }], "headline-lg-mobile": ["20px", { "lineHeight": "28px", "letterSpacing": "-0.01em", "fontWeight": "600" }] } } } };</script><style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head><body class="bg-surface font-body-md text-on-surface antialiased min-h-screen flex flex-col pt-safe pb-safe"><main class="flex-1 flex flex-col relative w-full bg-surface"><div class="flex flex-col w-full px-margin pb-space-xl">
<!-- Subtle decorative ambient glow behind top area -->
<div class="relative w-full flex flex-col items-center pt-space-md pb-space-lg">
<div class="absolute -top-10 w-48 h-48 bg-primary/10 rounded-full blur-3xl pointer-events-none"></div>
<!-- App Logo & Academic Badge -->
<div class="relative flex items-center justify-center w-20 h-20 rounded-xl bg-surface-container shadow-md mb-space-md">
<div class="w-14 h-14 rounded-lg bg-primary-container flex items-center justify-center shadow-sm">
<span class="material-symbols-outlined text-on-primary text-[32px]" style="font-variation-settings: 'FILL' 1;">menu_book</span>
</div>
<div class="absolute -bottom-1.5 -right-1.5 bg-secondary-container text-on-secondary-container rounded-full p-space-xs shadow-sm flex items-center justify-center">
<span class="material-symbols-outlined text-[16px]" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
</div>
<!-- Header Titles -->
<span class="font-label-sm text-label-sm uppercase tracking-wider text-primary font-semibold mb-space-xs">Việc học của tôi</span>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface text-center mb-space-xs">Đăng nhập</h1>
<p class="font-body-md text-body-md text-on-surface-variant text-center max-w-xs">Quản lý việc học mỗi ngày, nâng cao hiệu suất và tập trung học tập</p>
</div>
<!-- Main Login Card -->
<div class="w-full bg-surface-container-lowest rounded-xl p-space-lg shadow-sm flex flex-col gap-space-lg">
<!-- Academic Quote / Welcome Pill -->
<div class="flex items-center gap-space-sm bg-surface-container-low px-space-md py-space-sm rounded-lg text-primary">
<span class="material-symbols-outlined text-[20px]">auto_stories</span>
<span class="font-body-sm text-body-sm text-on-surface-variant truncate">Sẵn sàng hoàn thành bài tập hôm nay?</span>
</div>
<form class="flex flex-col gap-space-md" id="loginForm" onsubmit="event.preventDefault(); handleLogin();">
<!-- Email Field -->
<div class="flex flex-col gap-space-xs">
<label class="font-label-md text-label-md text-on-surface font-medium flex items-center justify-between" for="studentEmail">
<span>Email sinh viên</span>
<span class="text-outline text-label-sm font-label-sm">edu.vn</span>
</label>
<div class="relative flex items-center w-full">
<span class="material-symbols-outlined absolute left-space-md text-outline pointer-events-none text-[22px]">alternate_email</span>
<input autocomplete="email" class="w-full h-12 bg-surface-container-low text-on-surface font-body-md text-body-md rounded-lg pl-11 pr-space-md outline-none transition-all placeholder:text-outline/70 focus:bg-surface-container-lowest focus:shadow-md" id="studentEmail" name="email" placeholder="email@sinhvien.edu.vn" required="" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-space-xs">
<div class="flex items-center justify-between">
<label class="font-label-md text-label-md text-on-surface font-medium" for="studentPassword">Mật khẩu</label>
<button class="font-label-sm text-label-sm text-primary hover:underline outline-none transition-colors" type="button">
            Quên mật khẩu?
          </button>
</div>
<div class="relative flex items-center w-full">
<span class="material-symbols-outlined absolute left-space-md text-outline pointer-events-none text-[22px]">lock</span>
<input autocomplete="current-password" class="w-full h-12 bg-surface-container-low text-on-surface font-body-md text-body-md rounded-lg pl-11 pr-12 outline-none transition-all placeholder:text-outline/70 focus:bg-surface-container-lowest focus:shadow-md" id="studentPassword" name="password" placeholder="••••••••" required="" type="password"/>
<button aria-label="Hiện/ẩn mật khẩu" class="absolute right-space-sm h-10 w-10 flex items-center justify-center text-outline hover:text-on-surface transition-colors rounded-lg" id="togglePasswordBtn" type="button">
<span class="material-symbols-outlined text-[20px]" id="eyeIcon">visibility</span>
</button>
</div>
</div>
<!-- Quick Session Stay Option -->
<div class="flex items-center justify-between py-space-xs">
<label class="flex items-center gap-space-sm cursor-pointer select-none">
<input checked="" class="sr-only peer" id="rememberSession" type="checkbox"/>
<div class="w-5 h-5 rounded bg-surface-container-high peer-checked:bg-secondary flex items-center justify-center transition-all">
<span class="material-symbols-outlined text-on-secondary text-[16px] opacity-0 peer-checked:opacity-100 transition-opacity">check</span>
</div>
<span class="font-body-sm text-body-sm text-on-surface-variant">Duy trì đăng nhập thiết bị này</span>
</label>
</div>
<!-- Submit Button -->
<button class="w-full h-12 bg-primary-container hover:bg-primary text-on-primary font-label-lg text-label-lg rounded-lg shadow-sm flex items-center justify-center gap-space-sm transition-all active:scale-[0.99]" id="submitBtn" type="submit">
<span>Đăng nhập</span>
<span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
</form>
<!-- Visual Divider -->
<div class="relative flex items-center justify-center my-space-xs">
<div class="w-full h-px bg-surface-container-high"></div>
<span class="absolute px-space-md bg-surface-container-lowest font-label-sm text-label-sm text-outline">HOẶC TIẾP TỤC VỚI</span>
</div>
<!-- Quick School Identity Auth -->
<div class="grid grid-cols-2 gap-space-sm">
<button class="h-11 rounded-lg bg-surface-container-low hover:bg-surface-container text-on-surface flex items-center justify-center gap-space-xs font-label-md text-label-md transition-colors shadow-sm" type="button">
<span class="material-symbols-outlined text-primary text-[20px]">school</span>
<span>Cổng Đào tạo</span>
</button>
<button class="h-11 rounded-lg bg-surface-container-low hover:bg-surface-container text-on-surface flex items-center justify-center gap-space-xs font-label-md text-label-md transition-colors shadow-sm" type="button">
<span class="material-symbols-outlined text-error text-[20px]">mail</span>
<span>Google Edu</span>
</button>
</div>
</div>
<!-- Sign up Link Section -->
<div class="mt-space-lg flex flex-col items-center justify-center gap-space-xs text-center">
<p class="font-body-md text-body-md text-on-surface-variant">
      Chưa có tài khoản học tập?
    </p>
<button class="font-label-lg text-label-lg text-primary hover:text-on-primary-fixed-variant hover:underline font-semibold flex items-center gap-space-xs transition-colors" type="button">
<span>Đăng ký tài khoản mới</span>
<span class="material-symbols-outlined text-[18px]">person_add</span>
</button>
</div>
<!-- Micro Delight Toast Container -->
<div class="fixed bottom-space-lg left-1/2 -translate-x-1/2 w-[90%] max-w-xs bg-inverse-surface text-inverse-on-surface px-space-md py-space-sm rounded-lg shadow-xl flex items-center gap-space-sm opacity-0 pointer-events-none transition-all duration-300 transform translate-y-4 z-50" id="toastNotification">
<span class="material-symbols-outlined text-secondary-fixed text-[20px]" style="font-variation-settings: 'FILL' 1;">check_circle</span>
<span class="font-body-sm text-body-sm" id="toastMessage">Đang chuyển hướng vào học phần...</span>
</div>
</div>
<script>
  // Password visibility toggle interaction
  const toggleBtn = document.getElementById('togglePasswordBtn');
  const passwordInput = document.getElementById('studentPassword');
  const eyeIcon = document.getElementById('eyeIcon');

  if (toggleBtn && passwordInput && eyeIcon) {
    toggleBtn.addEventListener('click', () => {
      const isPassword = passwordInput.getAttribute('type') === 'password';
      passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
      eyeIcon.textContent = isPassword ? 'visibility_off' : 'visibility';
    });
  }

  // Visual submission feedback
  function handleLogin() {
    const btn = document.getElementById('submitBtn');
    const toast = document.getElementById('toastNotification');
    if (!btn || !toast) return;

    btn.disabled = true;
    const originalContent = btn.innerHTML;
    btn.innerHTML = `
      <span class="inline-block animate-spin material-symbols-outlined text-[20px]">sync</span>
      <span>Đang xác thực...</span>
    `;

    setTimeout(() => {
      btn.innerHTML = originalContent;
      btn.disabled = false;
      
      // Show confirmation toast
      toast.classList.remove('opacity-0', 'pointer-events-none', 'translate-y-4');
      toast.classList.add('opacity-100', 'translate-y-0');

      setTimeout(() => {
        toast.classList.remove('opacity-100', 'translate-y-0');
        toast.classList.add('opacity-0', 'pointer-events-none', 'translate-y-4');
      }, 2500);
    }, 1200);
  }
</script></main></body></html>
